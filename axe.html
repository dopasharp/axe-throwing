<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0E0D">
  <title>도끼 던지기 · 도끼 폰 | 도파#</title>
  <meta name="dopasharp:game" content="axe-throwing">
  <link rel="canonical" href="https://dopasharp.github.io/axe-throwing/">
  <meta name="description" content="휴대폰 두 대로 하는 도끼 던지기. 한 대는 과녁, 한 대는 도끼가 되어 휘둘러 던지는 인터랙티브 웹게임.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="도파# dopa.shap">
  <meta property="og:title" content="도끼 던지기 🪓">
  <meta property="og:description" content="휴대폰을 휘둘러 과녁에 도끼를 꽂아보세요. 5번 던져 최고 기록 도전!">
  <meta property="og:url" content="https://dopasharp.github.io/axe-throwing/">
  <meta property="og:image" content="https://dopasharp.github.io/axe-throwing/og/axe.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="dopasharp/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dopasharp/tokens.css">
  <link rel="stylesheet" href="dopasharp/components.css">
  <link rel="stylesheet" href="css/style.css?v=5">
  <script src="dopasharp/dopasharp.js" defer></script>
  <script type="module" src="js/axe.js?v=5"></script>
</head>
<body class="axe-page">
  <!-- 방 코드 입력 (QR 없이 들어온 경우) -->
  <section id="joinScreen" class="screen framed" hidden>
    <header data-dopa="header"></header>
    <form id="joinForm" class="card">
      <span class="dopa-label">AXE PHONE</span>
      <div class="hero-emoji" aria-hidden="true">🪓</div>
      <h1>도끼 입장</h1>
      <p>과녁 화면에 보이는 방 코드를 입력하세요</p>
      <input id="codeInput" class="code-input" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE">
      <button class="btn" type="submit">입장하기</button>
      <p id="joinError" class="error" role="alert"></p>
    </form>
    <footer data-dopa="footer"></footer>
  </section>

  <!-- 센서 허용 + 시작 -->
  <section id="startScreen" class="screen framed" hidden>
    <header data-dopa="header"></header>
    <div class="card">
      <span class="dopa-label">AXE PHONE</span>
      <div id="startEmoji" class="hero-emoji" aria-hidden="true">🪓</div>
      <h1>도끼 준비 완료</h1>
      <p>방 <b id="startRoom"></b> 과녁에 연결됐어요</p>
      <button id="startBtn" class="btn">시작하기</button>
      <p class="warn">⚠️ 폰을 놓치지 않게 <b>꽉 쥐고</b> 휘두르세요!<br>iPhone은 "동작 및 방향 접근" 허용이 필요해요<br>🔊 플레이 중 소리가 날 수 있어요</p>
      <p id="startError" class="error" role="alert"></p>
    </div>
    <footer data-dopa="footer"></footer>
  </section>

  <!-- 게임 -->
  <section id="gameScreen" class="screen" hidden>
    <header class="axe-hud">
      <div class="meta">
        <span>ROOM <b id="hudRoom"></b></span>
        <span id="hudCount">0 / 5</span>
      </div>
      <div class="score"><span id="hudTotal">0</span><small>점</small></div>
      <button id="optBtn" class="icon-btn" aria-label="옵션">⚙️</button>
    </header>

    <div class="aim" id="aimBox">
      <div class="aim-track"><div id="aimDot" class="aim-dot"></div></div>
      폰을 좌우로 기울여 조준
    </div>

    <div id="zone" class="zone">
      <div id="bigAxe" class="big-axe ready">🪓</div>
      <div id="result" class="result"></div>
    </div>

    <div class="power" aria-label="마지막 파워"><i id="powerBar"></i></div>
    <p id="hint" class="hint"><b>과녁을 향해 폰을 힘껏 휘두르세요!</b><br><small>또는 도끼를 위로 휙 스와이프</small></p>
    <div class="axe-status" role="status"><span id="connDot" class="dot on"></span><span id="connText">과녁 연결됨</span></div>
  </section>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <section id="optSheet" class="sheet" aria-label="옵션">
    <h3>⚙️ 옵션</h3>
    <div>
      <div class="opt-label">던질 물건</div>
      <div id="emojiGrid" class="emoji-grid"></div>
    </div>
    <div>
      <div class="opt-label">흔들기 감도</div>
      <div id="sensSeg" class="seg">
        <button data-v="low">둔감</button>
        <button data-v="mid">보통</button>
        <button data-v="high">민감</button>
      </div>
    </div>
    <div>
      <div class="opt-label">소리</div>
      <div id="soundSeg" class="seg">
        <button data-v="on">🔊 켜기</button>
        <button data-v="off">🔇 끄기</button>
      </div>
    </div>
    <div>
      <div class="opt-label">진동</div>
      <div id="vibeSeg" class="seg">
        <button data-v="on">📳 켜기</button>
        <button data-v="off">끄기</button>
      </div>
    </div>
    <button id="optClose" class="btn">확인</button>
  </section>
</body>
</html>
