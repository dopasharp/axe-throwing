<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0E0D">
  <title>도끼 던지기 | DOPA#</title>
  <meta name="dopasharp:game" content="axe-throwing">
  <link rel="canonical" href="https://dopasharp.github.io/axe-throwing/">
  <meta name="description" content="휴대폰 두 대로 하는 도끼 던지기. 한 대는 과녁, 한 대는 도끼가 되어 휘둘러 던지는 인터랙티브 웹게임.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DOPASHARP">
  <meta property="og:title" content="도끼 던지기 🪓">
  <meta property="og:description" content="휴대폰을 휘둘러 과녁에 도끼를 꽂아보세요. 5번 던져 최고 기록 도전!">
  <meta property="og:url" content="https://dopasharp.github.io/axe-throwing/">
  <meta property="og:image" content="https://dopasharp.github.io/axe-throwing/og/axe.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="dopasharp/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dopasharp/tokens.css">
  <link rel="stylesheet" href="dopasharp/components.css">
  <link rel="stylesheet" href="css/style.css?v=5">
  <script src="dopasharp/dopasharp.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="js/target.js?v=6"></script>
  <script>
    // 게임 스크립트가 아직 안 붙었거나 실패했을 때 버튼이 먹통처럼 보이지 않게 안내
    document.addEventListener('click', function (e) {
      if (window.__targetReady || !e.target.closest || !e.target.closest('#createBtn')) return;
      document.getElementById('lobbyError').textContent = '게임을 불러오지 못했어요. 페이지를 새로고침해 주세요.';
    });
  </script>
</head>
<body class="target-page">
  <div class="wall">
    <header class="hud">
      <div class="hud-left">
        <div class="room">ROOM <b id="roomCode">-----</b></div>
        <span id="modeBadge" class="badge" hidden>로컬 테스트 모드</span>
      </div>
      <div class="hud-score"><span id="total">0</span><small>점</small></div>
      <button id="qrBtn" class="icon-btn" aria-label="QR 코드 보기">📱</button>
    </header>

    <div id="throwsLeft" class="throws-left" aria-label="남은 도끼"></div>

    <main class="stage">
      <div id="target" class="target">
        <svg viewBox="-110 -110 220 220" aria-hidden="true">
          <defs>
            <radialGradient id="wood" cx="45%" cy="40%" r="65%">
              <stop offset="0" stop-color="#e6b885" />
              <stop offset="1" stop-color="#a86a3a" />
            </radialGradient>
            <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
              <feTurbulence type="fractalNoise" baseFrequency="0.012 0.32" numOctaves="3" seed="7" result="n" />
              <feColorMatrix in="n" type="matrix"
                values="0 0 0 0 0.22  0 0 0 0 0.11  0 0 0 0 0.04  1.4 0 0 0 -0.55" result="c" />
              <feComposite in="c" in2="SourceGraphic" operator="atop" />
            </filter>
          </defs>
          <circle r="107" fill="#2b1709" />
          <circle r="104" fill="none" stroke="#6b4223" stroke-width="3" stroke-dasharray="2 5" />
          <g filter="url(#grain)" stroke="#1a0f08" stroke-width="1.4">
            <circle r="100" fill="url(#wood)" />
            <circle r="85" fill="#2457c5" />
            <circle r="60" fill="url(#wood)" />
            <circle r="35" fill="#d61f2c" />
            <circle r="12" fill="#f3e5c8" />
            <circle r="4" fill="#d61f2c" stroke="none" />
          </g>
          <g font-family="Black Han Sans, sans-serif" font-size="10" text-anchor="middle" dominant-baseline="central">
            <text y="-92.5" fill="#3a1d0a">1</text>
            <text y="-72.5" fill="#fff">2</text>
            <text y="-47.5" fill="#3a1d0a">3</text>
            <text y="-23.5" fill="#fff">4</text>
          </g>
        </svg>
        <div id="stuck" class="stuck-layer"></div>
      </div>
    </main>

    <footer class="status">
      <span id="axeDot" class="dot off"></span>
      <span id="axeText">도끼 폰을 기다리는 중…</span>
    </footer>
  </div>

  <div id="flyLayer" class="fly-layer"></div>
  <div id="banner" class="banner"></div>

  <section id="lobby" class="overlay show lobby">
    <header data-dopa="header"></header>
    <div class="card">
      <span class="dopa-label">TWO-PHONE INTERACTIVE GAME</span>
      <div class="hero-emoji" aria-hidden="true">🎯</div>
      <h1>도끼 던지기 🪓</h1>
      <p>휴대폰 두 대로 하는 도끼 던지기.<br>이 폰이 <b>과녁</b>이 돼요.</p>
      <ol class="steps">
        <li><span><b>방 만들기</b> 이 휴대폰이 과녁이 돼요.</span></li>
        <li><span><b>QR 스캔</b> 다른 휴대폰으로 찍으면 도끼가 돼요.</span></li>
        <li><span><b>휘둘러 던지기</b> 5번 던져 최고 기록에 도전!</span></li>
      </ol>
      <p class="warn">🔊 플레이 중 소리가 날 수 있어요</p>
      <button id="createBtn" class="btn">게임 시작하기</button>
      <a class="btn ghost" href="axe.html">코드로 도끼 참가</a>
      <p id="lobbyError" class="error" role="alert"></p>
    </div>
    <footer data-dopa="footer"></footer>
  </section>

  <section id="qrOverlay" class="overlay">
    <div class="card">
      <span class="dopa-label">GAME 006 / AXE</span>
      <h2>도끼가 될 휴대폰으로<br>QR 코드를 스캔하세요</h2>
      <div id="qr" class="qr"></div>
      <div class="code">방 코드<b id="roomCode2">-----</b></div>
      <a id="axeLink" class="link" target="_blank" rel="noopener">도끼 링크</a>
      <button id="soundBtn" class="btn">🔊 소리 켜기</button>
      <button id="closeQr" class="btn ghost" hidden>닫기</button>
    </div>
  </section>

</body>
</html>
